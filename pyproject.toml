[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-router-opik-lab"
version = "0.1.0"
description = "OpenAI-compatible LLM gateway client with pluggable task routing"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.68.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/llm_gateway"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
markers = [
    "integration: requires running llama-server, Agent Router, and optionally Opik",
]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
